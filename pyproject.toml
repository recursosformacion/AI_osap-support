[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osap-support"
version = "0.1.0"
description = "Servicio de apoyo/membresía del ecosistema OSAP (relación de apoyo, economía no sensible y comunicaciones)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "PyMySQL>=1.1",
    "aiomysql>=0.2.0",
    "alembic>=1.13",
    "SQLAlchemy>=2.0",
    "PyJWT>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
osap-support-web = "api.main:run"
osap-support-worker = "infrastructure.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["domain", "application", "infrastructure", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401", "ANN001", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
