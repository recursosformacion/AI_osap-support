# osap.toml de DESARROLLO — único fichero de configuración de osap-api.
# En dev se usa este osap.toml; en prod se despliega osap.production.toml como osap.toml.
# Precedencia: entorno (OSAP_*) > osap.toml > BD (app_config) > defaults.
#
# NOTA: este fichero es el de DEV. En PRODUCCIÓN NO se usa este (ni su client_secret):
# prod usa osap.production.toml (con client_secret vacío) y el secret real va en el entorno
# del servicio systemd (OSAP_OIDC_CLIENT_SECRET), que vence a osap.toml.

[db]
host = "127.0.0.1"
name = "osap-api"
user = "osap2027"
password = "2027osapdb"

[osap]
deployment = "dev"
dev_auth_bypass = true
storage_web_base = "http://osap-storage"

[oidc]
issuer = "http://osap-auth/auth-api"
client_id = "osap-api"
redirect_uri = "http://osap-app/api/v1/auth/oidc/callback"
spa_origin = "http://osap-app"
scope = "openid profile"
# client_secret de DEV (cliente OAuth registrado contra el osap-auth local).
# En prod NO vale este; va vacío en osap.production.toml y el real en env (OSAP_OIDC_CLIENT_SECRET).
client_secret = "NzA6X6FJ752DxGTa7dyvj5PUWG_9aHgWnpnCPk2OjInehjwLHKl73rWpqbE6GTf8"
