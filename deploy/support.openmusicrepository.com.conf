# osap-support API — support.openmusicrepository.com (backend 127.0.0.1:8300)
#
# Acceso restringido: solo desde la app (openmusicrepository.com/app) o desde el propio
# servidor (M2M/OSAP interno). Bloquea el acceso directo/externo.
server {
    listen 80;
    listen [::]:80;
    server_name support.openmusicrepository.com;

    location /support-api/ {
        set $osap_ok 0;
        if ($http_referer ~* ^https?://(app\.)?openmusicrepository\.com) { set $osap_ok 1; }
        if ($http_origin  ~* ^https?://(app\.)?openmusicrepository\.com)  { set $osap_ok 1; }
        if ($remote_addr ~ "^(127\.0\.0\.1|::1|91\.134\.255\.134|2001:41d0:20a:900::182)$") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "91.134.255.134") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "2001:41d0:20a:900::182") { set $osap_ok 1; }
        if ($osap_ok = 0) { return 403; }

        rewrite ^/support-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $osap_ok 0;
        if ($http_referer ~* ^https?://(app\.)?openmusicrepository\.com) { set $osap_ok 1; }
        if ($http_origin  ~* ^https?://(app\.)?openmusicrepository\.com)  { set $osap_ok 1; }
        if ($remote_addr ~ "^(127\.0\.0\.1|::1|91\.134\.255\.134|2001:41d0:20a:900::182)$") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "91.134.255.134") { set $osap_ok 1; }
        if ($http_cf_connecting_ip = "2001:41d0:20a:900::182") { set $osap_ok 1; }
        if ($osap_ok = 0) { return 403; }
        default_type application/json;
        return 200 '{"service":"osap-support","status":"ok"}';
    }
}
