# OSAP Support — VirtualHost Apache (patrón osap-app, sin Docker).
#
# Dev (mismo patrón que osap-app): Apache sirve la SPA de osap-app (web/dist) y proxya
# /api → osap-api:8001. Aquí añadimos support bajo /support-api → osap-support:8300,
# con el prefijo reescrito (support no conoce /support-api).
#
# Producción: usar el dominio real de OSAP (support.openmusicrepository.com o el
# subpath del dominio principal) con los mismos ProxyPass/ProxyPassReverse.
#
# Requiere en httpd.conf: mod_proxy, mod_proxy_http, mod_rewrite.
#
# IMPORTANTE: el bloque /api/ de osap-app (osap-api) NO debe capturar /support-api.

<VirtualHost *:80>
    ServerName osap-app
    DocumentRoot "D:/Proyectos/AI_OSAP/osap-api/web/dist"
    <Directory "D:/Proyectos/AI_OSAP/osap-api/web/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # osap-api
    ProxyPass /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/
    ProxyPass /docs http://127.0.0.1:8001/docs
    ProxyPass /openapi.json http://127.0.0.1:8001/openapi.json
    ProxyPass /redoc http://127.0.0.1:8001/redoc

    # osap-support (el SPA llama a /support-api/api/v1/... → 8300/api/v1/...)
    ProxyPass /support-api/api/ http://127.0.0.1:8300/api/
    ProxyPassReverse /support-api/api/ http://127.0.0.1:8300/api/
    ProxyPass /support-api/docs http://127.0.0.1:8300/docs
    ProxyPass /support-api/openapi.json http://127.0.0.1:8300/openapi.json
    ProxyPass /support-api/health http://127.0.0.1:8300/health
    ProxyPass /support-api/ready http://127.0.0.1:8300/ready

    ErrorLog "logs/osap-app-error.log"
    CustomLog "logs/osap-app-access.log" combined
</VirtualHost>

# --- Alternativa producción: dominio propio de support ------------------------
#
# <VirtualHost *:443>
#     ServerName support.openmusicrepository.com
#     SSLEngine on
#     # ...certificados...
#     ProxyPass / http://127.0.0.1:8300/
#     ProxyPassReverse / http://127.0.0.1:8300/
#     ProxyPreserveHost On
# </VirtualHost>
#
# Nota CORS: si support se sirve bajo el MISMO origen que el frontend (osap-app), no se
# necesita CORS. Si se usa dominio propio, permitir SOLO el/los origen(es) reales del
# SPA en config (cors_origins); nunca Access-Control-Allow-Origin: * con credenciales.
