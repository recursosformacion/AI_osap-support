# osap.toml de PRODUCCIÓN — SOLO conexión a la BD operativa de osap-api.
# El resto de la configuración vive en la BD (app_config) o en entorno (OSAP_*).
# Este fichero se despliega como osap.toml en el servidor (~/osap-api/osap.toml).

[db]
host = "127.0.0.1"
name = "osap_api"
user = "osap"
password = "osap2027"

[osap]
storage_web_base = "https://storage.openmusicrepository.com"

[oidc]
issuer = "https://auth.openmusicrepository.com/auth-api"
client_id = "osap-api"
redirect_uri = "https://api.openmusicrepository.com/api/v1/auth/oidc/callback"
spa_origin = "https://app.openmusicrepository.com"
scope = "openid profile"
# Pon aquí el client_secret real (o en la env OSAP_OIDC_CLIENT_SECRET, con prioridad).
# En prod el secret va en el osap.toml del servidor / env del servicio; NO commitees el real.
client_secret = ""
